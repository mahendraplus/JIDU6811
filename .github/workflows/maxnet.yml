name: MaxNet Build

on:
  push:
    branches:
      - Max
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Fast Build & Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Calculate Semantic Version
        id: versioning
        run: |
          CDATE=$(date +'%Y.%m.%d')
          RUN_NUM="${{ github.run_number }}"
          SEM_VER="v2.2.${RUN_NUM}"
          TAG_NAME="v2.2.${RUN_NUM}-b${RUN_NUM}"
          echo "semver=${SEM_VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Clone OpenWrt and Apply JIDU6811 Files
        run: |
          rm -rf openwrt
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cp -r custom/files openwrt/
          mkdir -p openwrt/target/linux/qualcommbe/dts/qcom/
          cp -r custom/target/linux/qualcommbe/* openwrt/target/linux/qualcommbe/
          
          # Force strip debug symbols in target config-6.18
          sed -i 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set\nCONFIG_DEBUG_INFO_NONE=y/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_DEBUG_BUGVERBOSE=y/# CONFIG_DEBUG_BUGVERBOSE is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_LOCK_DEBUGGING_SUPPORT=y/# CONFIG_LOCK_DEBUGGING_SUPPORT is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_ARM64_PTR_AUTH=y/# CONFIG_ARM64_PTR_AUTH is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_ARM64_PTR_AUTH_KERNEL=y/# CONFIG_ARM64_PTR_AUTH_KERNEL is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_ARM64_GCS=y/# CONFIG_ARM64_GCS is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true
          sed -i 's/CONFIG_ARM64_SVE=y/# CONFIG_ARM64_SVE is not set/g' openwrt/target/linux/qualcommbe/config-6.18 2>/dev/null || true

      - name: Fast Cache OpenWrt Downloads & CCACHE
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host*
          key: openwrt-fastcache-${{ runner.os }}-qualcommbe-${{ hashFiles('custom/.github/scripts/write_config.py', 'custom/.github/scripts/add_device.py') }}
          restore-keys: |
            openwrt-fastcache-${{ runner.os }}-qualcommbe-

      - name: Register JIDU6811 Device Profile
        run: |
          python3 custom/.github/scripts/add_device.py openwrt/target/linux/qualcommbe/image/ipq95xx.mk

      - name: Configure Feeds and Kconfig
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Remove target restrictions on kmod-qrtr-smd and kmod-ath11k-ahb so they build on qualcommbe
          sed -i 's/@TARGET_qualcommax//g' package/kernel/linux/modules/netsupport.mk package/kernel/mac80211/ath.mk
          sed -i 's/default y if TARGET_qualcommax/default y/g' package/kernel/mac80211/ath.mk
          
          # Wipe OpenWrt metadata cache to force rescanning of modified package Makefiles
          rm -rf tmp
          
          # Copy mac80211 patches for IPQ9574 AHB support
          mkdir -p package/kernel/mac80211/patches/ath11k/
          cp -r ../custom/patches/mac80211/* package/kernel/mac80211/patches/ath11k/ 2>/dev/null || true
          
          # Populate release version and build timestamp in all banner locations
          NOW=$(date -u "+%Y-%m-%d %H:%M UTC")
          sed -i "s/VERSION_PLACEHOLDER/v2.2.${{ github.run_number }}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          sed -i "s/#BUILD_NUM_PLACEHOLDER/#${{ github.run_number }}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          sed -i "s/BUILD_TIMESTAMP_PLACEHOLDER/${NOW}/g" files/etc/banner package/base-files/files/etc/banner 2>/dev/null || true
          
          python3 ../custom/.github/scripts/write_config.py .config
          make defconfig
          python3 ../custom/.github/scripts/write_config.py .config
          make defconfig
          echo "=== ATH11K CONFIG CHECK ==="
          grep -E "ATH11K|QRTR" .config || true

      - name: Download Sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Gather Release Files
        run: |
          mkdir -p custom/release_files
          BINDIR=openwrt/bin/targets/qualcommbe/ipq95xx
          
          # Gather initramfs, sysupgrade, factory binaries
          ITB=$(ls "$BINDIR"/*initramfs-uImage.itb 2>/dev/null | head -n 1 || true)
          SYS=$(ls "$BINDIR"/*sysupgrade.bin 2>/dev/null | head -n 1 || true)
          FAC=$(ls "$BINDIR"/*factory.ubi 2>/dev/null | head -n 1 || true)
          
          if [ -n "$ITB" ]; then cp "$ITB" custom/release_files/initramfs.itb; fi
          if [ -n "$SYS" ]; then cp "$SYS" custom/release_files/sysupgrade.bin; fi
          if [ -n "$FAC" ]; then cp "$FAC" custom/release_files/factory.ubi; fi
          
          cp "$BINDIR"/sha256sums custom/release_files/ 2>/dev/null || true
          cp "$BINDIR"/profiles.json custom/release_files/ 2>/dev/null || true

          # Verify files exist
          ls -la custom/release_files/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jidu6811-firmware
          path: custom/release_files/

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.versioning.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.versioning.outputs.semver }}
        run: |
          gh release create "$TAG_NAME" custom/release_files/* \
            --title "$RELEASE_TITLE" \
            --notes "### 🚀 MaxNet OpenWrt Firmware for Jio AirFiber IDU (JIDU6811)
            
            - **Base**: OpenWrt Linux 6.18 (QualcommBE IPQ9574)
            - **Target**: JioRouter AX6000 JIDU6811 / JIDU6J11
            - **Build Tag**: \`$TAG_NAME\`"
